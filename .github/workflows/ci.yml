name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # A real-world project the tests convert and compile. It is checked out here
  # rather than committed: jaffle-shop has no licence, so it cannot be
  # redistributed.
  JAFFLE_SHOP_REF: 5beb145b00f5465ec759cfcdd9745e858818cf95

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check out dbt-labs/jaffle-shop
        uses: actions/checkout@v7
        with:
          repository: dbt-labs/jaffle-shop
          ref: ${{ env.JAFFLE_SHOP_REF }}
          path: _jaffle_shop

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # The tests compile every converted project with the Dataform CLI.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run the tests
        env:
          DBT_BQ_TO_DATAFORM_EXAMPLE: ${{ github.workspace }}/_jaffle_shop
          DBT_BQ_TO_DATAFORM_REQUIRE_EXAMPLE: "1"
        run: uv run --locked pytest
